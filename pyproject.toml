[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ledgibly"
description = "Reusable implementation-ledger framework for Cursor-driven repos"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "ledgibly contributors" }]
keywords = ["ledger", "cursor", "agents", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Rust",
  "Topic :: Software Development",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/FedeMatt/ledgibly"
Repository = "https://github.com/FedeMatt/ledgibly"
Documentation = "https://github.com/FedeMatt/ledgibly/blob/main/docs/README.md"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true
